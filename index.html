<!-- Lily GK Journal — v21.1 — 20 Aug 2026 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Lily's GK Journal</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GK Journal">
<meta name="theme-color" content="#0A1830">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
</head>
<body>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap');

  :root{
    --bg:#0A1830;
    --surface:#14315A;
    --surface-2:#1C4272;
    --line:#2E5794;
    --text:#FFFFFF;
    --text-dim:#B7CBEA;
    --text-faint:#87A0C7;
    --lime:#DFC07E;
    --lime-dim:#B08F49;
    --cyan:#5B9BFF;
    --amber:#E7B563;
    --red:#FF8080;
    --violet:#A78BFA;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);}
  #gk-root{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    max-width:430px;
    min-height:100vh;
    margin:0 auto;
    position:relative;
    display:flex;
    flex-direction:column;
    padding-bottom:78px;
  }
  #gk-root .mono{font-family:'JetBrains Mono',monospace;}
  #gk-root .disp{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.02em;}

  /* Header */
  .gk-header{
    padding:22px 20px 14px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--bg) 85%, transparent);
    backdrop-filter: blur(6px);
  }
  .header-version{
    position:absolute; top:20px; right:20px;
    font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.03em;
    color:var(--text-faint); border:1px solid var(--line); border-radius:20px; padding:3px 9px;
  }
  .gk-header h1{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:24px; margin:0;
    text-transform:uppercase; letter-spacing:0.01em; color:var(--text);
  }
  .header-profile{display:flex; align-items:center; gap:12px; margin:10px 0 12px;}
  .avatar-wrap{
    width:46px; height:46px; border-radius:50%; overflow:hidden; flex-shrink:0;
    border:2px solid var(--lime); position:relative; cursor:pointer; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
  }
  .avatar-img{width:100%; height:100%; object-fit:cover; display:none;}
  .avatar-fallback{font-family:'Oswald',sans-serif; font-weight:700; font-size:19px; color:var(--lime);}
  .header-profile-text{display:flex; flex-direction:column;}
  .gk-header .eyebrow{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:15.5px; color:var(--lime);
    letter-spacing:0.01em;
  }
  .eyebrow-sub{
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.1em;
    text-transform:uppercase; color:var(--text-faint); margin-top:2px;
  }

  /* Form strip - signature element */
  .form-strip{display:flex; align-items:flex-end; gap:3px; height:34px; margin-top:4px;}
  .form-strip .bar{
    flex:1; min-width:6px; border-radius:2px 2px 0 0; background:var(--line);
    display:flex; align-items:flex-end; position:relative;
  }
  .form-strip .bar .fill{width:100%; border-radius:2px 2px 0 0;}
  .form-strip .bar.training .fill{background:var(--cyan);}
  .form-strip .bar.match .fill{background:var(--lime);}
  .form-strip .bar.gym .fill{background:var(--amber);}
  .form-strip .bar.analysis .fill{background:var(--violet);}
  .form-strip-empty{font-size:11px; color:var(--text-faint); font-family:'JetBrains Mono',monospace;}

  /* Main content */
  .gk-view{padding:18px 20px 8px; flex:1;}
  .gk-view.hidden{display:none;}

  .section-label{
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.12em;
    color:var(--text-dim); text-transform:uppercase; margin:22px 0 10px;
  }
  .section-label:first-child{margin-top:0;}

  /* Cards */
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; margin-bottom:10px;
  }
  .card.pressable{cursor:pointer; transition:border-color .15s, background .15s;}
  .card.pressable:active{background:var(--surface-2); border-color:var(--lime-dim);}

  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .card-title{font-family:'Oswald',sans-serif; font-weight:600; font-size:16.5px; text-transform:uppercase; letter-spacing:0.01em;}
  .card-meta{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); margin-top:3px;}
  .card-focus{font-size:13.5px; color:var(--text-dim); margin-top:8px; line-height:1.45;}
  .theme-chip{display:inline-block; margin-top:8px; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--lime); border:1px solid rgba(223,192,126,0.4); background:rgba(223,192,126,0.08); padding:3px 9px; border-radius:20px;}

  .tag{
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    padding:3px 8px; border-radius:20px; white-space:nowrap; flex-shrink:0;
  }
  .tag.training{background:rgba(91,155,255,0.12); color:var(--cyan); border:1px solid rgba(91,155,255,0.35);}
  .tag.match{background:rgba(223,192,126,0.1); color:var(--lime); border:1px solid rgba(223,192,126,0.35);}
  .tag.gym{background:rgba(231,181,99,0.12); color:var(--amber); border:1px solid rgba(231,181,99,0.35);}
  .tag.analysis{background:rgba(167,139,250,0.14); color:var(--violet); border:1px solid rgba(167,139,250,0.35);}

  .rating-pill{
    font-family:'JetBrains Mono',monospace; font-weight:600; font-size:13px;
    width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; border:1.5px solid var(--line);
  }
  .r1{color:var(--red); border-color:rgba(255,107,107,0.4);}
  .r2{color:var(--amber); border-color:rgba(255,180,84,0.4);}
  .r3{color:var(--text-dim); border-color:var(--line);}
  .r4{color:var(--cyan); border-color:rgba(76,201,240,0.4);}
  .r5{color:var(--lime); border-color:rgba(212,255,61,0.4);}

  .empty-state{
    text-align:center; padding:36px 20px; color:var(--text-faint); font-size:13.5px; line-height:1.6;
  }
  .empty-state .disp{font-size:15px; color:var(--text-dim); margin-bottom:6px; display:block;}

  /* Buttons */
  .btn{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; text-transform:uppercase; letter-spacing:0.04em;
    border:none; border-radius:8px; padding:13px 18px; cursor:pointer; width:100%;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-primary{background:var(--lime); color:var(--bg);}
  .btn-primary:active{background:var(--lime-dim);}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--text);}
  .btn-ghost:active{border-color:var(--text-dim);}
  .btn-fab{
    position:fixed; bottom:88px; right:calc(50% - 215px + 20px); z-index:25;
    width:52px; height:52px; border-radius:50%; background:var(--lime); color:var(--bg);
    display:flex; align-items:center; justify-content:center; border:none; box-shadow:0 4px 16px rgba(212,255,61,0.25);
    font-size:26px; cursor:pointer;
  }
  @media (max-width:430px){ .btn-fab{ right:20px; } }

  /* Bottom nav */
  .gk-nav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px;
    background:rgba(27,35,45,0.92); backdrop-filter:blur(10px); border-top:1px solid var(--line);
    display:flex; z-index:30;
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:11px 4px 9px; background:none; border:none; cursor:pointer; color:var(--text-faint);
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.06em; text-transform:uppercase;
    border-top:2px solid transparent;
  }
  .nav-item.active{color:var(--lime); border-top-color:var(--lime);}
  .nav-item svg{width:20px; height:20px;}

  /* Forms */
  .field{margin-bottom:16px;}
  .field label{
    display:block; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--text-dim); margin-bottom:7px;
  }
  .field input[type=text], .field input[type=date], .field textarea, .field select{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
    padding:11px 12px; color:var(--text); font-family:'Inter',sans-serif; font-size:14.5px; resize:vertical;
  }
  .field textarea{min-height:70px; line-height:1.5;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:none; border-color:var(--lime-dim);}
  .field .hint{font-size:12px; color:var(--text-faint); margin-top:5px; line-height:1.4;}
  .known-match-info{
    background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:11px 12px;
    color:var(--text-dim); font-size:14.5px;
  }

  .type-toggle{display:flex; gap:6px;}
  .type-toggle button{
    flex:1; padding:10px 4px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2);
    color:var(--text-dim); font-family:'Oswald',sans-serif; font-weight:600; font-size:11.5px; text-transform:uppercase; cursor:pointer;
  }
  .type-toggle button.active.training{border-color:var(--cyan); color:var(--cyan); background:rgba(91,155,255,0.08);}
  .type-toggle button.active.match{border-color:var(--lime); color:var(--lime); background:rgba(223,192,126,0.08);}
  .type-toggle button.active.gym{border-color:var(--amber); color:var(--amber); background:rgba(231,181,99,0.08);}
  .type-toggle button.active.analysis{border-color:var(--violet); color:var(--violet); background:rgba(167,139,250,0.08);}

  .rating-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .rating-row .r-label{font-size:13.5px; color:var(--text); flex:1;}
  .rating-item{margin-bottom:2px;}
  .rating-item .rating-row{margin-bottom:6px;}
  .r-label-wrap{display:flex; align-items:center; gap:7px; flex:1;}
  .info-icon{
    width:17px; height:17px; border-radius:50%; border:1.5px solid var(--text-faint); background:none;
    color:var(--text-faint); font-family:'JetBrains Mono',monospace; font-style:italic; font-weight:600; font-size:10.5px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; flex-shrink:0; line-height:1;
    position:relative;
  }
  .info-icon::after{
    content:''; position:absolute; top:-9px; left:-9px; right:-9px; bottom:-9px;
  }
  .info-icon.active{border-color:var(--lime); color:var(--lime);}

  .edit-schedule-icon{
    width:22px; height:22px; border-radius:50%; border:1.5px solid var(--text-faint); background:none;
    color:var(--text-faint); font-size:12px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0; flex-shrink:0; position:relative;
  }
  .edit-schedule-icon::after{
    content:''; position:absolute; top:-10px; left:-10px; right:-10px; bottom:-10px;
  }
  .edit-schedule-icon:active{border-color:var(--lime); color:var(--lime);}

  .hudl-link{
    display:inline-block; font-family:'Oswald',sans-serif; font-weight:600; font-size:12.5px; text-transform:uppercase; letter-spacing:0.02em;
    color:var(--bg); background:var(--lime); padding:8px 14px; border-radius:8px; text-decoration:none;
  }
  .hudl-link-inline{margin-top:8px;}

  .hudl-step{
    background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:2px 14px; margin-top:8px;
  }
  .hudl-step summary{
    padding:11px 0; cursor:pointer; font-family:'Oswald',sans-serif; font-weight:600; font-size:13px; color:var(--text); list-style:none;
  }
  .hudl-step summary::-webkit-details-marker{display:none;}
  .hudl-step summary::before{content:'▸ '; color:var(--lime);}
  .hudl-step[open] summary::before{content:'▾ ';}
  .hudl-step p{font-size:12.5px; color:var(--text-dim); line-height:1.55; margin:0 0 12px;}

  .policy-alert{
    background:rgba(223,192,126,0.08); border:1px solid rgba(223,192,126,0.35); border-radius:10px;
    padding:12px 14px; font-size:12.5px; line-height:1.55; color:var(--text-dim);
  }

  .pde-flip-outer{margin-bottom:18px;}
  .pde-flip-card{
    width:100%; max-width:230px; aspect-ratio:9/16; margin:0 auto; perspective:1200px; cursor:pointer;
  }
  .pde-flip-inner{
    position:relative; width:100%; height:100%;
    transition:transform 0.6s cubic-bezier(0.4,0.2,0.2,1); transform-style:preserve-3d;
  }
  .pde-flip-card.flipped .pde-flip-inner{ transform:rotateY(180deg); }
  .pde-face{
    position:absolute; inset:0; -webkit-backface-visibility:hidden; backface-visibility:hidden;
    border-radius:16px; padding:20px 16px; display:flex; flex-direction:column; overflow-y:auto;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
  .pde-face-front{
    background:linear-gradient(160deg, var(--surface-2), var(--bg) 75%);
    border:1.5px solid var(--violet);
    align-items:center; justify-content:center; text-align:center; gap:6px;
  }
  .pde-front-icons{font-size:26px; letter-spacing:4px;}
  .pde-front-title{font-family:'Oswald',sans-serif; font-weight:700; font-size:26px; letter-spacing:0.04em; color:var(--text); margin-top:8px;}
  .pde-front-sub{font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.04em; color:var(--violet); margin-top:2px;}
  .pde-front-tag{
    margin-top:22px; font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--text-faint); border:1px solid var(--line); border-radius:20px; padding:4px 10px;
  }
  .pde-face-back{
    background:var(--surface); border:1.5px solid var(--line); transform:rotateY(180deg); justify-content:flex-start;
  }
  .pde-cols{display:flex; flex-direction:column; gap:10px; flex:1;}
  .pde-col-head{font-family:'Oswald',sans-serif; font-weight:600; font-size:12px; color:var(--violet); margin-bottom:3px;}
  .pde-col-sub{color:var(--text-faint); font-weight:400; text-transform:none; font-size:10.5px;}
  .pde-list{margin:0; padding-left:16px; font-size:11px; color:var(--text-dim); line-height:1.5;}
  .pde-face-back #pde-insert-btn{margin-top:10px; font-size:10.5px; padding:9px 8px;}
  .pde-flip-hint{
    text-align:center; margin-top:10px; font-family:'JetBrains Mono',monospace; font-size:11px;
    letter-spacing:0.04em; color:var(--violet); animation:pde-pulse 1.8s ease-in-out infinite;
  }
  @keyframes pde-pulse{ 0%,100%{opacity:0.55;} 50%{opacity:1;} }

  .info-tooltip{
    display:none; font-size:12px; color:var(--text-dim); line-height:1.5; background:var(--surface-2);
    border:1px solid var(--line); border-radius:8px; padding:9px 11px; margin:-2px 0 14px;
  }
  .info-tooltip.visible{display:block;}
  .rating-scale{display:flex; gap:5px;}
  .rating-scale button{
    width:34px; height:34px; border-radius:50%; border:1.5px solid var(--line); background:var(--surface-2);
    color:var(--text-dim); font-family:'JetBrains Mono',monospace; font-weight:600; font-size:13px; cursor:pointer;
  }
  .rating-scale button.selected.r1{background:var(--red); border-color:var(--red); color:var(--bg);}
  .rating-scale button.selected.r2{background:var(--amber); border-color:var(--amber); color:var(--bg);}
  .rating-scale button.selected.r3{background:var(--text-dim); border-color:var(--text-dim); color:var(--bg);}
  .rating-scale button.selected.r4{background:var(--cyan); border-color:var(--cyan); color:var(--bg);}
  .rating-scale button.selected.r5{background:var(--lime); border-color:var(--lime); color:var(--bg);}

  .overall-scale{display:flex; gap:6px; margin-bottom:6px;}
  .overall-scale button{flex:1; padding:10px 2px; border-radius:8px; border:1.5px solid var(--line); background:var(--surface-2);
    color:var(--text-dim); font-family:'Oswald',sans-serif; font-weight:600; font-size:11px; text-transform:uppercase; cursor:pointer; text-align:center;}
  .overall-scale button.selected.r1{background:rgba(255,107,107,0.15); border-color:var(--red); color:var(--red);}
  .overall-scale button.selected.r2{background:rgba(255,180,84,0.15); border-color:var(--amber); color:var(--amber);}
  .overall-scale button.selected.r3{background:rgba(139,152,165,0.15); border-color:var(--text-dim); color:var(--text);}
  .overall-scale button.selected.r4{background:rgba(76,201,240,0.15); border-color:var(--cyan); color:var(--cyan);}
  .overall-scale button.selected.r5{background:rgba(212,255,61,0.15); border-color:var(--lime); color:var(--lime);}

  /* Modal */
  .gk-modal-backdrop{
    position:fixed; inset:0; background:rgba(8,10,14,0.72); z-index:50; display:flex; align-items:flex-end;
  }
  .gk-modal-backdrop.hidden{display:none;}
  .gk-modal{
    background:var(--bg); border-top:1px solid var(--line); border-radius:18px 18px 0 0;
    width:100%; max-width:430px; margin:0 auto; max-height:90vh; overflow-y:auto;
    padding:18px 20px 28px; position:relative;
  }
  .modal-handle{width:36px; height:4px; background:var(--line); border-radius:4px; margin:0 auto 14px;}
  .modal-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
  .modal-header h2{font-family:'Oswald',sans-serif; font-weight:700; font-size:19px; text-transform:uppercase; margin:0;}
  .modal-close{background:none; border:none; color:var(--text-dim); font-size:22px; cursor:pointer; line-height:1; padding:4px;}

  /* Progress view */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
  .stat-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px;}
  .stat-num{font-family:'Oswald',sans-serif; font-weight:700; font-size:26px; color:var(--lime);}
  .stat-label{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px;}

  .attr-bar-row{margin-bottom:14px;}
  .drill-row{cursor:pointer; border-radius:8px; margin:-6px -6px 8px; padding:6px;}
  .drill-row:active{background:var(--surface-2);}
  .summary-list{margin-bottom:6px;}
  .summary-item{display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; line-height:1.5;}
  .summary-item:last-child{border-bottom:none;}
  .summary-date{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--text-faint); flex-shrink:0; min-width:64px; padding-top:1px;}
  .summary-text{color:var(--text-dim);}
  .attr-bar-top{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px;}
  .attr-bar-top .name{color:var(--text);}
  .attr-bar-top .val{font-family:'JetBrains Mono',monospace; color:var(--text-dim);}
  .attr-bar-track{height:7px; background:var(--surface-2); border-radius:4px; overflow:hidden; border:1px solid var(--line);}
  .attr-bar-fill{height:100%; background:linear-gradient(90deg, var(--cyan), var(--lime)); border-radius:4px;}

  .chart-wrap{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 12px 10px; margin-bottom:6px;}
  .chart-legend{display:flex; gap:16px; font-size:11px; color:var(--text-dim); margin-top:6px; font-family:'JetBrains Mono',monospace;}
  .chart-legend span{display:inline-flex; align-items:center; gap:5px;}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}

  /* Standards view */
  .standard-card{border-left:3px solid var(--lime);}
  .standard-card h3{font-family:'Oswald',sans-serif; font-size:15.5px; text-transform:uppercase; margin:0 0 5px; color:var(--text);}
  .standard-card p{font-size:13px; color:var(--text-dim); line-height:1.55; margin:0;}
  .contact-card .card-focus{margin-top:6px;}
  .contact-method{
    display:inline-block; margin-top:9px; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--cyan); border:1px solid rgba(91,155,255,0.35); background:rgba(91,155,255,0.1);
    padding:3px 9px; border-radius:20px;
  }

  function handleAvatarFile(file){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var size = 240;
        var canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        var ctx = canvas.getContext('2d');
        var side = Math.min(img.width, img.height);
        var sx = (img.width - side) / 2, sy = (img.height - side) / 2;
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        state.profile = state.profile || {};
        state.profile.avatarDataUrl = dataUrl;
        saveData();
        renderAvatar();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ---------- PDF Import ----------
  var DAY_NAMES = ['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY','SUNDAY'];
  var MONTH_NAMES = ['january','february','march','april','may','june','july','august','september','october','november','december'];

  document.getElementById('import-pdf-btn').addEventListener('click', function(){
    document.getElementById('import-pdf-input').click();
  });

  document.getElementById('import-pdf-input').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var statusEl = document.getElementById('import-status');
    statusEl.textContent = 'Reading PDF…';
    if(!window.pdfjsLib){
      statusEl.textContent = 'PDF library did not load — check your connection and try again.';
      return;
    }
    extractPdfTextItems(file).then(function(items){
      var parsed = parseScheduleItems(items);
      statusEl.textContent = '';
      e.target.value = '';
      if(parsed.error){
        openImportReview([], parsed.error);
      } else {
        openImportReview(parsed.days, null);
      }
    }).catch(function(err){
      console.error(err);
      statusEl.textContent = '';
      e.target.value = '';
      openImportReview([], 'Could not read that PDF. You can still add the week manually below.');
    });
  });

  function extractPdfTextItems(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){
        var typedarray = new Uint8Array(reader.result);
        pdfjsLib.getDocument({ data: typedarray }).promise.then(function(pdf){
          return pdf.getPage(1);
        }).then(function(page){
          return page.getTextContent();
        }).then(function(content){
          resolve(content.items);
        }).catch(reject);
      };
      reader.onerror = reject;
      reader.readAsArrayBuffer(file);
    });
  }

  function parseScheduleItems(items){
    var fullText = items.map(function(it){ return it.str; }).join(' ');

    var dayHeaders = [];
    items.forEach(function(it){
      var s = it.str.trim().toUpperCase();
      if(DAY_NAMES.indexOf(s) !== -1){
        dayHeaders.push({ day: s, x: it.transform[4] });
      }
    });
    if(dayHeaders.length === 0){
      return { error: 'Could not find day columns (Monday–Sunday) in this PDF — the layout may not match what was expected.' };
    }
    // keep first (top-most header row) occurrence of each day, left to right
    var seen = {};
    dayHeaders = dayHeaders.filter(function(h){
      if(seen[h.day]) return false;
      seen[h.day] = true;
      return true;
    }).sort(function(a,b){ return a.x - b.x; });

    var weekStart = null;
    var wcMatch = fullText.match(/(\d{1,2})(st|nd|rd|th)\s+([A-Za-z]+)\s+(\d{4})/);
    if(wcMatch){
      var dnum = parseInt(wcMatch[1], 10);
      var monthIdx = MONTH_NAMES.indexOf(wcMatch[3].toLowerCase());
      var year = parseInt(wcMatch[4], 10);
      if(monthIdx > -1){ weekStart = new Date(year, monthIdx, dnum); }
    }

    var columns = dayHeaders.map(function(h){ return { day: h.day, x: h.x, items: [] }; });

    // Discard text that's clearly not day-column content: exact day names, the
    // small date sub-label under each day header (e.g. "24th"), and known
    // fixed labels like "NOTES" that sit below the table.
    var xs = columns.map(function(c){ return c.x; }).sort(function(a,b){ return a-b; });
    var spacing = xs.length > 1 ? (xs[xs.length-1] - xs[0]) / (xs.length - 1) : 999;
    var maxDist = spacing * 0.6;

    items.forEach(function(it){
      var s = it.str.trim();
      if(!s) return;
      if(DAY_NAMES.indexOf(s.toUpperCase()) !== -1) return;
      if(/^\d{1,2}(st|nd|rd|th)$/i.test(s)) return;
      if(s.toUpperCase() === 'NOTES') return;
      var x = it.transform[4], y = it.transform[5];
      var nearest = columns[0], best = Math.abs(x - columns[0].x);
      columns.forEach(function(c){
        var d = Math.abs(x - c.x);
        if(d < best){ best = d; nearest = c; }
      });
      if(best > maxDist) return;
      nearest.items.push({ str: s, y: y });
    });

    var results = [];
    columns.forEach(function(c, idx){
      c.items.sort(function(a,b){ return b.y - a.y; });
      var text = c.items.map(function(i){ return i.str; }).join(' ');
      var dateObj = null;
      if(weekStart){
        dateObj = new Date(weekStart);
        dateObj.setDate(weekStart.getDate() + idx);
      }
      parseColumnText(c.day, text, dateObj).forEach(function(e){ results.push(e); });
    });

    return { days: results };
  }

  function toIsoDate(d){
    var y = d.getFullYear(), m = ('0'+(d.getMonth()+1)).slice(-2), day = ('0'+d.getDate()).slice(-2);
    return y + '-' + m + '-' + day;
  }

  function titleCase(s){ return s.charAt(0) + s.slice(1).toLowerCase(); }

  function parseColumnText(dayName, text, dateObj){
    var baseDate = dateObj ? toIsoDate(dateObj) : '';
    var trimmed = text.trim();

    if(/^\s*off\s*$/i.test(trimmed) || (/\boff\b/i.test(text) && trimmed.length < 8)){
      return [{ day: titleCase(dayName), date: baseDate, type:'training', title:'', time:'', location:'', coach:'', opponent:'', theme:'', off:true }];
    }

    var isMatch = /\bgame\b|\bvs\.?\b|\bko\b/i.test(text);
    var coachMatch = text.match(/Coach:?\s*([A-Za-z]+)/i);
    var locMatch = text.match(/(Hub\s*\d*|Main)\s*(Grass|3G|Astro)/i);
    var sharedCoach = coachMatch ? coachMatch[1] : '';
    var sharedLocation = locMatch ? locMatch[0].replace(/\s+/g,' ').trim() : '';
    var themeMatch = text.match(/dominate\s+the\s+(goal|ball|area|space)/i);
    var sharedTheme = themeMatch ? ('Dominate the ' + titleCase(themeMatch[1])) : '';

    function baseEntry(){
      return { day: titleCase(dayName), date: baseDate, type:'training', title:'', time:'', location: sharedLocation, coach: sharedCoach, opponent:'', theme: sharedTheme, off:false };
    }

    if(isMatch){
      var mEntry = baseEntry();
      mEntry.type = 'match';
      var vsMatch = text.match(/vs\.?\s+([A-Za-z .'-]+?)(?=\s*\(|\s+\d{1,2}:\d{2}|\s+Arrival|\s+Coach|$)/i);
      if(vsMatch) mEntry.opponent = vsMatch[1].trim();
      var haMatch = text.match(/\(([HA])\)/i);
      mEntry.title = 'Match' + (haMatch ? ' (' + haMatch[1].toUpperCase() + ')' : '');
      var mTimes = text.match(/\d{1,2}:\d{2}/g) || [];
      if(mTimes.length){
        var labels = [];
        if(/arrival/i.test(text)) labels.push('Arrival ' + mTimes[0]);
        if(mTimes.length > 1) labels.push('KO ' + mTimes[1]);
        mEntry.time = labels.length ? labels.join(' / ') : mTimes.join(' / ');
      }
      return [mEntry];
    }

    // Multiple activities in one day (e.g. "Classroom 17:45  Gym 18:15  Session 19:00")
    var activityRegex = /(Classroom|Gym|Session)\s*[:\-]?\s*(\d{1,2}:\d{2})/gi;
    var found = [];
    var am;
    while((am = activityRegex.exec(text)) !== null){
      found.push({ keyword: am[1].toLowerCase(), time: am[2] });
    }

    if(found.length > 0){
      return found.map(function(f){
        var e = baseEntry();
        if(f.keyword === 'classroom'){
          e.type = 'analysis';
          e.title = 'Analysis Session';
          e.location = 'Classroom';
        } else if(f.keyword === 'gym'){
          e.type = 'gym';
          e.title = 'Gym Session';
          e.location = 'Gym';
          e.coach = '';
        } else {
          e.type = 'training';
          e.title = dayName ? (titleCase(dayName) + ' Training') : 'Training';
        }
        e.time = f.time;
        return e;
      });
    }

    // Fallback: freeform text without a recognized keyword+time pairing
    var fbEntry = baseEntry();
    var isGymFallback = /\bgym\b|\bweights\b|\bstrength\b|\bconditioning\b/i.test(text);
    var isAnalysisFallback = !isGymFallback && /\banalysis\b|\breview\b|\bclip\b|\bvideo\b|\bclassroom\b/i.test(text);
    fbEntry.type = isGymFallback ? 'gym' : (isAnalysisFallback ? 'analysis' : 'training');
    var fbTimes = text.match(/\d{1,2}:\d{2}/g) || [];
    if(fbEntry.type === 'gym'){
      fbEntry.title = 'Gym Session';
      fbEntry.location = 'Gym';
      fbEntry.coach = '';
    } else if(fbEntry.type === 'analysis'){
      fbEntry.title = 'Analysis Session';
      fbEntry.location = 'Classroom';
    } else if(/\btraining\b|\bsession\b/i.test(text)){
      fbEntry.title = dayName ? (titleCase(dayName) + ' Training') : 'Training';
    } else if(trimmed){
      fbEntry.title = trimmed.slice(0, 40);
    } else {
      fbEntry.off = true;
      return [fbEntry];
    }
    if(fbTimes.length) fbEntry.time = fbTimes[0];
    return [fbEntry];
  }

  // ---------- Import Review Modal ----------
  function openImportReview(days, errorMsg){
    var rowsHtml = days.map(function(d, i){
      var summary = d.day + (d.time ? ' ' + d.time : '') + (d.off ? ' — Off' : ' (' + d.type + ')') + (d.date ? ' — ' + fmtDate(d.date) : '');
      return '<div class="import-row" data-idx="' + i + '">' +
        '<div class="import-row-head">' +
          '<div class="import-row-summary">' + escapeHtml(summary) + '</div>' +
          '<label class="import-off"><input type="checkbox" class="imp-off" ' + (d.off ? 'checked' : '') + '> Off/Skip this one</label>' +
        '</div>' +
        '<div class="import-fields" style="' + (d.off ? 'display:none;' : '') + '">' +
          '<div class="type-toggle" style="margin-bottom:10px;">' +
            '<button type="button" class="imp-type ' + (d.type==='training'?'active training':'') + '" data-type="training">Training</button>' +
            '<button type="button" class="imp-type ' + (d.type==='match'?'active match':'') + '" data-type="match">Match</button>' +
            '<button type="button" class="imp-type ' + (d.type==='gym'?'active gym':'') + '" data-type="gym">Gym</button>' +
            '<button type="button" class="imp-type ' + (d.type==='analysis'?'active analysis':'') + '" data-type="analysis">Analysis</button>' +
          '</div>' +
          '<div class="field"><label>Title</label><input type="text" class="imp-title" value="' + escapeHtml(d.title) + '"></div>' +
          '<div class="field"><label>Date</label><input type="date" class="imp-date" value="' + d.date + '"></div>' +
          '<div class="field"><label>Time</label><input type="text" class="imp-time" value="' + escapeHtml(d.time) + '"></div>' +
          '<div class="field"><label>Location</label><input type="text" class="imp-location" value="' + escapeHtml(d.location) + '"></div>' +
          '<div class="field"><label>Coach</label><input type="text" class="imp-coach" value="' + escapeHtml(d.coach) + '"></div>' +
          '<div class="imp-theme-wrap field" style="' + (d.type==='gym'?'display:none;':'') + '"><label>Theme</label><select class="imp-theme">' +
            '<option value="">No theme</option>' +
            THEMES.map(function(t){ return '<option value="' + t + '"' + (d.theme === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') +
          '</select></div>' +
          '<div class="imp-opponent-wrap" style="' + (d.type==='match'?'':'display:none;') + '"><div class="field"><label>Opponent</label><input type="text" class="imp-opponent" value="' + escapeHtml(d.opponent) + '"></div></div>' +
        '</div>' +
      '</div>';
    }).join('');

    openModal(
      '<div class="modal-handle"></div>' +
      '<div class="modal-header"><h2>Review Import</h2><button class="modal-close" id="close-modal">×</button></div>' +
      (errorMsg ? '<div class="empty-state" style="padding:8px 0 18px;">' + escapeHtml(errorMsg) + '</div>' : '') +
      (days.length ? '<div class="hint" style="margin-bottom:16px;">Check each day against the real schedule — fix anything that\'s off, tick "Off/Skip" for rest days, then import.</div>' + rowsHtml : '') +
      (days.length ? '<button class="btn btn-primary" id="confirm-import" style="margin-top:8px;">Import to Schedule</button>' : '') +
      '<button class="btn btn-ghost" id="cancel-import" style="margin-top:10px;">' + (days.length ? 'Cancel' : 'Close') + '</button>'
    );

    document.getElementById('close-modal').addEventListener('click', closeModal);
    document.getElementById('cancel-import').addEventListener('click', closeModal);

    document.querySelectorAll('.import-row').forEach(function(row){
      row.querySelector('.imp-off').addEventListener('change', function(e){
        row.querySelector('.import-fields').style.display = e.target.checked ? 'none' : '';
      });
      row.querySelectorAll('.imp-type').forEach(function(b){
        b.addEventListener('click', function(){
          var t = b.getAttribute('data-type');
          row.querySelectorAll('.imp-type').forEach(function(x){ x.classList.remove('active','training','match','gym','analysis'); });
          b.classList.add('active', t);
          row.querySelector('.imp-opponent-wrap').style.display = t === 'match' ? '' : 'none';
          row.querySelector('.imp-theme-wrap').style.display = t === 'gym' ? 'none' : '';
        });
      });
    });

    var confirmBtn = document.getElementById('confirm-import');
    if(confirmBtn){
      confirmBtn.addEventListener('click', function(){
        try{
          var newEntries = [];
          var datesToReplace = [];
          document.querySelectorAll('.import-row').forEach(function(row){
            if(row.querySelector('.imp-off').checked) return;
            var type = row.querySelector('.imp-type.active') ? row.querySelector('.imp-type.active').getAttribute('data-type') : 'training';
            var date = row.querySelector('.imp-date').value;
            if(!date) return;
            datesToReplace.push(date);
            newEntries.push({
              id: uid(),
              title: row.querySelector('.imp-title').value.trim() || (type === 'match' ? 'Match' : 'Training'),
              date: date,
              type: type,
              focus: '',
              time: row.querySelector('.imp-time').value.trim(),
              location: row.querySelector('.imp-location').value.trim(),
              coach: row.querySelector('.imp-coach').value.trim(),
              theme: row.querySelector('.imp-theme').value,
              opponent: type === 'match' ? row.querySelector('.imp-opponent').value.trim() : '',
              gkCount: '',
              preActivationDone: false
            });
          });
          // remove any existing schedule entries on the dates being imported, so re-imports after changes don't duplicate
          state.schedule = state.schedule.filter(function(s){ return datesToReplace.indexOf(s.date) === -1; });
          state.schedule = state.schedule.concat(newEntries);
          if(newEntries.length){
            scheduleWeekStart = mondayOf(new Date(newEntries[0].date + 'T00:00:00'));
          }
          saveData();
        }catch(err){
          console.error('Import to schedule failed', err);
        }
        closeModal();
        switchView('today');
      });
    }
  }


  // ---------- Render: Journal ----------
  function renderJournal(){
    var list = document.getElementById('journal-list');
    var items = sortByDate(state.reflections).reverse();
    if(items.length === 0){
      list.innerHTML = '<div class="empty-state"><span class="disp">No entries yet</span>Reflections you save will build into a journal here — tap + to add one.</div>';
      return;
    }
    list.innerHTML = items.map(function(r){
      var displayTitle = reflectionDisplayTitle(r);
      var pillHtml = r.type === 'gym'
        ? '<div class="rating-pill ' + (r.gymCompleted === false ? 'r1' : 'r5') + '">' + (r.gymCompleted === false ? '✗' : '✓') + '</div>'
        : '<div class="rating-pill ' + ratingClass(r.overall) + '">' + r.overall + '</div>';
      var previewText = r.type === 'gym' ? (r.gymFocus || 'Gym session') : (r.wentWell || r.evidence || r.action || '');
      return '<div class="card pressable" data-reflection-id="' + r.id + '">' +
        '<div class="card-top">' +
          '<div>' +
            '<div class="card-title">' + escapeHtml(displayTitle) + '</div>' +
            '<div class="card-meta">' + fmtDate(r.date) + '</div>' +
          '</div>' +
          '<div style="display:flex; align-items:center; gap:8px;">' +
            '<span class="tag ' + r.type + '">' + r.type + '</span>' +
            pillHtml +
          '</div>' +
        '</div>' +
        '<div class="card-focus">' + escapeHtml(truncate(previewText, 90)) + '</div>' +
        (r.theme ? '<div class="theme-chip">' + escapeHtml(r.theme) + '</div>' : '') +
      '</div>';
    }).join('');

    list.querySelectorAll('[data-reflection-id]').forEach(function(card){
      card.addEventListener('click', function(){
        openReflectionDetail(card.getAttribute('data-reflection-id'));
      });
    });
  }

  function truncate(s, n){ if(!s) return ''; return s.length > n ? s.slice(0,n) + '…' : s; }

  function escapeHtml(s){
    if(!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function reflectionDisplayTitle(r){
    if(r.type === 'match' && r.opponent && r.title.indexOf(r.opponent) === -1){
      return r.title + ' vs ' + r.opponent;
    }
    return r.title;
  }

  // ---------- Render: Progress ----------
  function renderProgress(){
    var refs = sortByDate(state.reflections);
    var statsEl = document.getElementById('progress-stats');
    var trainingCount = refs.filter(function(r){ return r.type === 'training'; }).length;
    var matchCount = refs.filter(function(r){ return r.type === 'match'; }).length;
    var gymCount = refs.filter(function(r){ return r.type === 'gym'; }).length;
    var analysisCount = refs.filter(function(r){ return r.type === 'analysis'; }).length;

    statsEl.innerHTML =
      '<div class="stat-card"><div class="stat-num">' + refs.length + '</div><div class="stat-label">Total Entries</div></div>' +
      '<div class="stat-card"><div class="stat-num">' + avgOverall(refs) + '</div><div class="stat-label">Average Rating</div></div>' +
      '<div class="stat-card"><div class="stat-num">' + trainingCount + '</div><div class="stat-label">Training Sessions</div></div>' +
      '<div class="stat-card"><div class="stat-num">' + matchCount + '</div><div class="stat-label">Matches</div></div>' +
      '<div class="stat-card"><div class="stat-num">' + gymCount + '</div><div class="stat-label">Gym Sessions</div></div>' +
      '<div class="stat-card"><div class="stat-num">' + analysisCount + '</div><div class="stat-label">Analysis Sessions</div></div>';

    drawChart(refs.filter(function(r){ return typeof r.overall === 'number'; }));
    renderAttrAverages(refs);
    renderThemeAverages(refs);
    renderMindGym();
  }

  var MINDGYM_METHODS = ['VR Headset', 'Visual Training Games', 'Pattern Recognition Games', 'Scanning Games', 'Training Lights'];

  function renderMindGym(){
    var el = document.getElementById('mindgym-card');
    if(!el) return;
    var weekStart = mondayOf(new Date());
    var weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 6);
    var startIso = toIsoDate(weekStart), endIso = toIsoDate(weekEnd);
    var logs = (state.mindgymLogs || []).filter(function(l){ return l.date >= startIso && l.date <= endIso; });
    var current = logs.length ? logs[logs.length - 1] : null;

    el.innerHTML =
      '<label class="check-row" style="margin-top:0;">' +
        '<input type="checkbox" id="mindgym-check" ' + (current ? 'checked' : '') + '>' +
        '<span>Completed weekly MindGym cognitive session</span>' +
      '</label>' +
      '<div id="mindgym-method-wrap" class="field" style="margin-top:12px;' + (current ? '' : ' display:none;') + '">' +
        '<label>Method used</label><select id="mindgym-method">' +
        MINDGYM_METHODS.map(function(m){ return '<option value="' + m + '"' + (current && current.method === m ? ' selected' : '') + '>' + m + '</option>'; }).join('') +
        '</select>' +
      '</div>';

    document.getElementById('mindgym-check').addEventListener('change', function(e){
      if(e.target.checked){
        state.mindgymLogs = state.mindgymLogs || [];
        state.mindgymLogs.push({ id: uid(), date: todayIso(), method: MINDGYM_METHODS[0] });
        saveData();
      } else if(current){
        state.mindgymLogs = (state.mindgymLogs || []).filter(function(l){ return l.id !== current.id; });
        saveData();
      }
      renderMindGym();
    });

    var methodSelect = document.getElementById('mindgym-method');
    if(methodSelect){
      methodSelect.addEventListener('change', function(){
        if(current){ current.method = methodSelect.value; saveData(); }
      });
    }
  }

  function avgOverall(refs){
    var rated = refs.filter(function(r){ return typeof r.overall === 'number'; });
    if(rated.length === 0) return '—';
    var sum = rated.reduce(function(a,r){ return a + r.overall; }, 0);
    return (sum / rated.length).toFixed(1);
  }

  function drawChart(refs){
    var svg = document.getElementById('progress-chart');
    var w = 380, h = 140, padL = 24, padR = 10, padT = 14, padB = 22;
    if(refs.length === 0){
      svg.innerHTML = '<text x="190" y="72" text-anchor="middle" fill="#87A0C7" font-family="JetBrains Mono, monospace" font-size="11">No data yet</text>';
      return;
    }
    var recent = refs.slice(-14);
    var plotW = w - padL - padR;
    var plotH = h - padT - padB;
    var stepX = recent.length > 1 ? plotW / (recent.length - 1) : 0;

    function yFor(v){ return padT + plotH - ((v - 1) / 4) * plotH; }

    var pts = recent.map(function(r, i){ return { x: padL + stepX * i, y: yFor(r.overall), r: r }; });
    var pathD = pts.map(function(p,i){ return (i===0?'M':'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ');

    var gridLines = '';
    [1,2,3,4,5].forEach(function(v){
      var y = yFor(v);
      gridLines += '<line x1="' + padL + '" y1="' + y + '" x2="' + (w-padR) + '" y2="' + y + '" stroke="#2E5794" stroke-width="1"/>';
      gridLines += '<text x="' + (padL-8) + '" y="' + (y+3) + '" text-anchor="end" font-size="9" fill="#87A0C7" font-family="JetBrains Mono, monospace">' + v + '</text>';
    });

    var dots = pts.map(function(p){
      var color = p.r.type === 'match' ? '#DFC07E' : (p.r.type === 'gym' ? '#E7B563' : (p.r.type === 'analysis' ? '#A78BFA' : '#5B9BFF'));
      return '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="3.5" fill="' + color + '" stroke="#0A1830" stroke-width="1.5"/>';
    }).join('');

    svg.innerHTML = gridLines +
      '<path d="' + pathD + '" fill="none" stroke="#B7CBEA" stroke-width="1.5" opacity="0.5"/>' +
      dots;
  }

  function renderAttrAverages(refs){
    var el = document.getElementById('attr-averages');
    if(refs.length === 0){
      el.innerHTML = '<div class="empty-state" style="padding:16px 0;">Log a few reflections to see her standards profile build up.</div>';
      return;
    }
    el.innerHTML = ATTR_KEYS.map(function(k){
      var vals = refs.map(function(r){ return r.attributes ? r.attributes[k] : null; }).filter(function(v){ return v; });
      var avg = vals.length ? (vals.reduce(function(a,b){return a+b;},0) / vals.length) : 0;
      var pct = (avg / 5) * 100;
      return '<div class="attr-bar-row drill-row" data-key="' + k + '">' +
        '<div class="attr-bar-top"><span class="name">' + ATTR_LABELS[k] +
          '<button type="button" class="info-icon" data-info-key="' + k + '" aria-label="What does ' + ATTR_LABELS[k] + ' mean?" style="margin-left:6px; vertical-align:middle;">i</button></span>' +
          '<span class="val">' + (avg ? avg.toFixed(1) : '—') + '</span></div>' +
        '<div class="info-tooltip" data-tooltip-key="' + k + '">' + escapeHtml(ATTR_DESC[k] || '') + '</div>' +
        '<div class="attr-bar-track"><div class="attr-bar-fill" style="width:' + pct + '%"></div></div>' +
      '</div>';
    }).join('');
  }

  // one-time delegated listener so Progress tab tooltips and drilldowns work across re-renders
  document.getElementById('attr-averages').addEventListener('click', function(e){
    var icon = e.target.closest('.info-icon');
    if(icon){
      e.stopPropagation();
      var key = icon.getAttribute('data-info-key');
      var tooltip = this.querySelector('.info-tooltip[data-tooltip-key="' + key + '"]');
      var wasVisible = tooltip && tooltip.classList.contains('visible');
      this.querySelectorAll('.info-tooltip').forEach(function(t){ t.classList.remove('visible'); });
      this.querySelectorAll('.info-icon').forEach(function(ic){ ic.classList.remove('active'); });
      if(tooltip && !wasVisible){
        tooltip.classList.add('visible');
        icon.classList.add('active');
      }
      return;
    }
    var row = e.target.closest('.drill-row');
    if(row && row.getAttribute('data-key')){
      openStandardDrilldown(row.getAttribute('data-key'));
    }
  });

  function renderThemeAverages(refs){
    var el = document.getElementById('theme-averages');
    var themed = refs.filter(function(r){ return r.theme; });
    if(themed.length === 0){
      el.innerHTML = '<div class="empty-state" style="padding:16px 0;">Tag a few reflections with a theme (from the weekly schedule) to see how she rates herself in each area.</div>';
      return;
    }
    el.innerHTML = THEMES.map(function(t){
      var vals = themed.filter(function(r){ return r.theme === t; });
      if(vals.length === 0) return '';
      var avg = vals.reduce(function(a,r){ return a + r.overall; }, 0) / vals.length;
      var pct = (avg / 5) * 100;
      return '<div class="attr-bar-row drill-row" data-theme="' + escapeHtml(t) + '">' +
        '<div class="attr-bar-top"><span class="name">' + t + ' <span style="color:var(--text-faint);">(' + vals.length + ')</span></span><span class="val">' + avg.toFixed(1) + '</span></div>' +
        '<div class="attr-bar-track"><div class="attr-bar-fill" style="width:' + pct + '%"></div></div>' +
      '</div>';
    }).join('');
  }

  // one-time delegated listener for theme drilldowns
  document.getElementById('theme-averages').addEventListener('click', function(e){
    var row = e.target.closest('.drill-row');
    if(row && row.getAttribute('data-theme')){
      openThemeDrilldown(row.getAttribute('data-theme'));
    }
  });

  function renderDrillList(entries, valueFn){
    if(entries.length === 0) return '<div class="empty-state">No reflections here yet.</div>';
    return entries.map(function(r){
      return '<div class="card pressable" data-drill-id="' + r.id + '">' +
        '<div class="card-top">' +
          '<div><div class="card-title">' + escapeHtml(reflectionDisplayTitle(r)) + '</div><div class="card-meta">' + fmtDate(r.date) + '</div></div>' +
          '<div style="display:flex; align-items:center; gap:8px;"><span class="tag ' + r.type + '">' + r.type + '</span><div class="rating-pill ' + ratingClass(valueFn(r)) + '">' + valueFn(r) + '</div></div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function renderDrillSummary(entries){
    if(entries.length === 0) return '';
    var avg = entries.reduce(function(a,r){ return a + r.overall; }, 0) / entries.length;

    function bulletList(lines, emptyMsg){
      if(lines.length === 0) return '<div class="empty-state" style="padding:8px 0;">' + emptyMsg + '</div>';
      return '<div class="summary-list">' + lines.map(function(l){
        return '<div class="summary-item"><span class="summary-date">' + fmtDate(l.date) + '</span><span class="summary-text">' + escapeHtml(l.text) + '</span></div>';
      }).join('') + '</div>';
    }

    var wwLines = entries.filter(function(r){ return r.wentWell; }).map(function(r){ return { date: r.date, text: r.wentWell }; });
    var ebiLines = entries.filter(function(r){ return r.evenBetterIf; }).map(function(r){ return { date: r.date, text: r.evenBetterIf }; });

    return '<div class="stat-grid" style="margin-bottom:18px;">' +
        '<div class="stat-card"><div class="stat-num">' + entries.length + '</div><div class="stat-label">Entries</div></div>' +
        '<div class="stat-card"><div class="stat-num">' + avg.toFixed(1) + '</div><div class="stat-label">Average Rating</div></div>' +
      '</div>' +
      '<div class="section-label" style="margin-top:0;">What Went Well — Every Entry</div>' +
      bulletList(wwLines, 'Nothing logged yet.') +
      '<div class="section-label">Even Better If — Every Entry</div>' +
      bulletList(ebiLines, 'Nothing logged yet.') +
      '<div class="section-label">Individual Sessions</div>';
  }

  function wireDrillList(){
    document.querySelectorAll('[data-drill-id]').forEach(function(card){
      card.addEventListener('click', function(){ openReflectionDetail(card.getAttribute('data-drill-id')); });
    });
  }

  function openStandardDrilldown(key){
    var entries = sortByDate(state.reflections.filter(function(r){ return r.attributes && r.attributes[key]; })).reverse();
    openModal(
      '<div class="modal-handle"></div>' +
      '<div class="modal-header"><h2>' + ATTR_LABELS[key] + '</h2><button class="modal-close" id="close-modal">×</button></div>' +
      (ATTR_DESC[key] ? '<div class="hint" style="margin-bottom:14px;">' + escapeHtml(ATTR_DESC[key]) + '</div>' : '') +
      renderDrillSummary(entries) +
      renderDrillList(entries, function(r){ return r.attributes[key]; })
    );
    document.getElementById('close-modal').addEventListener('click', closeModal);
    wireDrillList();
  }

  function openThemeDrilldown(theme){
    var entries = sortByDate(state.reflections.filter(function(r){ return r.theme === theme; })).reverse();
    openModal(
      '<div class="modal-handle"></div>' +
      '<div class="modal-header"><h2>' + escapeHtml(theme) + '</h2><button class="modal-close" id="close-modal">×</button></div>' +
      renderDrillSummary(entries) +
      renderDrillList(entries, function(r){ return r.overall; })
    );
    document.getElementById('close-modal').addEventListener('click', closeModal);
    wireDrillList();
  }

  // ---------- Goals (IFAs) ----------
  function renderGoals(){
    var el = document.getElementById('goals-list');
    var goals = state.goals || [];
    var active = goals.filter(function(g){ return g.status !== 'achieved'; });
    var achieved = goals.filter(function(g){ return g.status === 'achieved'; });

    function goalCard(g){
      var metaBits = ['Set ' + fmtDate(g.dateSet)];
      if(g.pillar) metaBits.push(ATTR_LABELS[g.pillar]);
      if(g.targetDate) metaBits.push('Target ' + fmtDate(g.targetDate));
      return '<div class="card pressable" data-goal-id="' + g.id + '">' +
        '<div class="card-top">' +
          '<div><div class="card-title">' + escapeHtml(g.title) + '</div><div class="card-meta">' + metaBits.map(escapeHtml).join(' · ') + '</div></div>' +
          (g.status === 'achieved' ? '<span class="tag match">Achieved</span>' : '') +
        '</div>' +
        (g.how ? '<div class="card-focus"><strong>How:</strong> ' + escapeHtml(g.how) + '</div>' : '') +
        (g.who ? '<div class="card-focus"><strong>Who:</strong> ' + escapeHtml(g.who) + '</div>' : '') +
      '</div>';
    }

    var html = '';
    if(active.length === 0 && achieved.length === 0){
      html = '<div class="empty-state"><span class="disp">No goals set yet</span>Add what comes out of the coaches\' goal-setting meeting, so there\'s something concrete to measure against over the coming weeks.</div>';
    } else {
      html += active.map(goalCard).join('');
      if(achieved.length){
        html += '<div class="section-label">Achieved</div>' + achieved.map(goalCard).join('');
      }
    }
    el.innerHTML = html;

    document.querySelectorAll('[data-goal-id]').forEach(function(card){
      card.addEventListener('click', function(){
        var g = (state.goals || []).find(function(x){ return x.id === card.getAttribute('data-goal-id'); });
        if(g) openGoalForm(g);
      });
    });
  }

  document.getElementById('add-goal-btn').addEventListener('click', function(){ openGoalForm(null); });

  document.getElementById('import-goals-btn').addEventListener('click', openGoalImportModal);

  function openGoalImportModal(){
    openModal(
      '<div class="modal-handle"></div>' +
      '<div class="modal-header"><h2>Import Goals</h2><button class="modal-close" id="close-modal">×</button></div>' +
      '<div class="hint" style="margin-bottom:14px;">Paste the goal list prepared from a meeting transcript or notes below. This adds to whatever goals are already here — it won\'t remove anything.</div>' +
      '<textarea id="goal-import-json" placeholder="Paste the goals list here..." style="width:100%; min-height:140px; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; color:var(--text); font-family:\'JetBrains Mono\',monospace; font-size:10.5px; padding:10px; margin-bottom:12px;"></textarea>' +
      '<button class="btn btn-primary" id="import-goals-confirm">Import Goals</button>'
    );
    document.getElementById('close-modal').addEventListener('click', closeModal);
    document.getElementById('import-goals-confirm').addEventListener('click', function(){
      var raw = document.getElementById('goal-import-json').value.trim();
      if(!raw){ alert('Paste the goals list in first.'); return; }
      try{
        var parsed = JSON.parse(raw);
        if(!Array.isArray(parsed)) throw new Error('Not a list');
        var todayStr = todayIso();

  // ---------- Weekly Summary (PDF) ----------
  function mondayOf(d){
    var date = new Date(d);
    var day = date.getDay();
    var diff = (day === 0 ? -6 : 1) - day;
    date.setDate(date.getDate() + diff);
    date.setHours(0,0,0,0);
    return date;
  }

  function generateWeeklyPdf(weekStart){
    var weekEnd = new Date(weekStart);
    weekEnd.setDate(weekStart.getDate() + 6);
    var startIso = toIsoDate(weekStart), endIso = toIsoDate(weekEnd);

    var scheduleWeek = sortByDate(state.schedule.filter(function(s){ return s.date >= startIso && s.date <= endIso; }));
    var reflectionsWeek = sortByDate(state.reflections.filter(function(r){ return r.date >= startIso && r.date <= endIso; }));

    var doc = new window.jspdf.jsPDF({ unit:'mm', format:'a4' });
    var pageW = doc.internal.pageSize.getWidth();
    var pageH = doc.internal.pageSize.getHeight();
    var marginX = 18, marginTop = 20, marginBottom = 18;
    var maxWidth = pageW - marginX * 2;
    var y = marginTop;

    function checkPageBreak(extra){
      if(y + (extra || 8) > pageH - marginBottom){ doc.addPage(); y = marginTop; }
    }

    function heading(text, size){
      checkPageBreak((size || 13) * 0.6);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(size || 13);
      doc.setTextColor(15, 25, 50);
      doc.text(text, marginX, y);
      y += (size || 13) * 0.5 + 3;
    }

    function subheading(text){
      checkPageBreak(7);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10.5);
      doc.setTextColor(30, 55, 100);
      var lines = doc.splitTextToSize(text, maxWidth);
      lines.forEach(function(line){
        checkPageBreak(6);
        doc.text(line, marginX, y);
        y += 5.5;
      });
      y += 0.5;
    }

    function bodyText(text, opts){
      opts = opts || {};
      doc.setFont('helvetica', opts.bold ? 'bold' : 'normal');
      doc.setFontSize(opts.size || 9.5);
      var c = opts.color || [60, 70, 90];
      doc.setTextColor(c[0], c[1], c[2]);
      var lines = doc.splitTextToSize(text, maxWidth - (opts.indent || 0));
      lines.forEach(function(line){
        checkPageBreak(5);
        doc.text(line, marginX + (opts.indent || 0), y);
        y += 5;
      });
    }

    function spacer(h){ y += (h || 4); }

    function divider(){
      checkPageBreak(4);
      doc.setDrawColor(215, 215, 215);
      doc.line(marginX, y, pageW - marginX, y);
      y += 6;
    }

    // Title
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(18);
    doc.setTextColor(10, 24, 48);
    doc.text("Lily's GK Journal", marginX, y); y += 8;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(11.5);
    doc.setTextColor(100, 100, 100);
    doc.text('Weekly Summary — ' + fmtDate(startIso) + ' to ' + fmtDate(endIso), marginX, y); y += 10;
    divider();

    // At a glance
    var ratedThisWeek = reflectionsWeek.filter(function(r){ return typeof r.overall === 'number'; });
    var avgRating = ratedThisWeek.length ? (ratedThisWeek.reduce(function(a,r){ return a + r.overall; }, 0) / ratedThisWeek.length).toFixed(1) : '—';
    var trainingCount = reflectionsWeek.filter(function(r){ return r.type === 'training'; }).length;
    var matchCount = reflectionsWeek.filter(function(r){ return r.type === 'match'; }).length;
    var gymCount = reflectionsWeek.filter(function(r){ return r.type === 'gym'; }).length;
    heading('This Week At A Glance', 12);
    bodyText('Sessions logged: ' + reflectionsWeek.length + '    Average rating: ' + avgRating + '/5    Training: ' + trainingCount + '    Matches: ' + matchCount + '    Gym: ' + gymCount);
    spacer(3);

    if(reflectionsWeek.length){
      subheading('Standards Averages');
      ATTR_KEYS.forEach(function(k){
        var vals = reflectionsWeek.map(function(r){ return r.attributes ? r.attributes[k] : null; }).filter(function(v){ return v; });
        var avg = vals.length ? (vals.reduce(function(a,b){ return a + b; }, 0) / vals.length).toFixed(1) : '—';
        bodyText(ATTR_LABELS[k] + ': ' + avg + '/5', { indent:2 });
      });
      spacer(3);
    }
    divider();

    // Schedule
    heading('Schedule This Week', 12);
    if(scheduleWeek.length === 0){
      bodyText('No sessions scheduled.');
    } else {
      scheduleWeek.forEach(function(s){
        subheading(fmtDate(s.date) + ' — ' + s.title + (s.opponent ? ' vs ' + s.opponent : ''));
        var metaBits = [s.type];
        if(s.time) metaBits.push(s.time);
        if(s.location) metaBits.push(s.location);
        if(s.coach) metaBits.push('Coach: ' + s.coach);
        if(s.theme) metaBits.push(s.theme);
        bodyText(metaBits.join('  ·  '), { size:8.5, color:[125,125,125] });
        spacer(2);
      });
    }
    spacer(3);
    divider();

    // Reflections
    heading('Reflections', 12);
    if(reflectionsWeek.length === 0){
      bodyText('No reflections logged this week.');
    } else {
      reflectionsWeek.forEach(function(r){
        checkPageBreak(20);
        var ratingTag = r.type === 'gym' ? (r.gymCompleted === false ? '[Not completed]' : '[Completed]') : ('[' + r.overall + '/5]');
        subheading(fmtDate(r.date) + ' — ' + r.title + '   ' + ratingTag);
        var metaBits = [r.type];
        if(r.theme) metaBits.push(r.theme);
        if(r.gymFocus) metaBits.push(r.gymFocus);
        if(r.opponent) metaBits.push(r.opponent);
        if(r.matchClass){
          var mc = MATCH_CLASS.find(function(m){ return m.key === r.matchClass; });
          if(mc) metaBits.push(mc.label);
        }
        bodyText(metaBits.join('  ·  '), { size:8.5, color:[125,125,125] });
        spacer(1);
        if(r.evidence) bodyText('Evidence: ' + r.evidence, { indent:2 });
        if(r.wentWell) bodyText('Went well: ' + r.wentWell, { indent:2 });
        if(r.evenBetterIf) bodyText('Even better if: ' + r.evenBetterIf, { indent:2 });
        if(r.action) bodyText('Next action: ' + r.action, { indent:2 });
        var attrBits = ATTR_KEYS.filter(function(k){ return r.attributes && r.attributes[k]; }).map(function(k){ return ATTR_LABELS[k] + ' ' + r.attributes[k]; });
        if(attrBits.length) bodyText('Standards: ' + attrBits.join(', '), { indent:2, size:8.5, color:[140,140,140] });
        spacer(5);
      });
    }

    var pageCount = doc.internal.getNumberOfPages();
    for(var p = 1; p <= pageCount; p++){
      doc.setPage(p);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      doc.setTextColor(165, 165, 165);
      doc.text('Generated ' + new Date().toLocaleDateString('en-GB') + '   ·   Page ' + p + ' of ' + pageCount, marginX, pageH - 10);
    }

    doc.save('lily-gk-journal-week-' + startIso + '.pdf');
  }

    function applyAttrVisibility(type){
      document.querySelectorAll('#ref-attr-rows .rating-item').forEach(function(row){
        var key = row.getAttribute('data-key');
        var show = true;
        if(type === 'gym') show = (key === 'physical');
        else if(type === 'analysis') show = (key === 'tactical' || key === 'psych');
        row.style.display = show ? '' : 'none';
      });

    applyAttrVisibility(currentType);

    document.getElementById('close-modal').addEventListener('click', closeModal);

    document.getElementById('ref-type-toggle').querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){

        b.classList.add('active', currentType);
        document.getElementById('match-extra-fields').style.display = currentType === 'match' ? '' : 'none';

        document.getElementById('ref-standard-fields').style.display = currentType === 'gym' ? 'none' : '';

        b.addEventListener('click', function(){
          selectedMatchClass = b.getAttribute('data-val');
          matchClassToggle.querySelectorAll('button').forEach(function(x){ x.classList.remove('selected'); });
          b.classList.add('selected');
        });

        document.querySelectorAll('#overall-scale button').forEach(function(x){ x.classList.remove('selected'); });
        b.classList.add('selected');
      });
    });

    var selectedAttrs = (existingReflection && existingReflection.attributes) ? JSON.parse(JSON.stringify(existingReflection.attributes)) : {};
    document.querySelectorAll('.rating-scale').forEach(function(scale){
      var key = scale.getAttribute('data-attr');
      scale.querySelectorAll('button').forEach(function(b){
        b.addEventListener('click', function(){
          var v = parseInt(b.getAttribute('data-val'), 10);
          selectedAttrs[key] = v;
          scale.querySelectorAll('button').forEach(function(x){ x.classList.remove('selected','r1','r2','r3','r4','r5'); });

          checkInjuryFlag();
        });
      });

    function checkInjuryFlag(){
      var alertEl = document.getElementById('injury-alert');
      if(!alertEl) return;
      var ids = ['ref-evidence','ref-action','ref-gym-focus'];
      var textBlob = ids.map(function(id){
        var elx = document.getElementById(id);
        return elx ? elx.value : '';
      }).join(' ').toLowerCase();
      var keywordHit = /injury|hurt|pain|niggle/.test(textBlob);
      var lowPhysical = selectedAttrs.physical && selectedAttrs.physical <= 2;
      alertEl.style.display = (keywordHit || lowPhysical) ? '' : 'none';
    }

    ['ref-evidence','ref-action','ref-gym-focus'].forEach(function(id){
      var fieldEl = document.getElementById(id);
      if(fieldEl) fieldEl.addEventListener('input', checkInjuryFlag);

        var template = 'Position: \nDecision: \nExecution: ';

        var item = icon.closest('.rating-item');
        var tooltip = item ? item.querySelector('.info-tooltip') : null;
        var wasVisible = tooltip && tooltip.classList.contains('visible');
        document.querySelectorAll('#ref-attr-rows .info-tooltip').forEach(function(t){ t.classList.remove('visible'); });
        document.querySelectorAll('#ref-attr-rows .info-icon').forEach(function(ic){ ic.classList.remove('active'); });
        if(tooltip && !wasVisible){
          tooltip.classList.add('visible');
          icon.classList.add('active');
        }
      });

    function collectRecoveryChecklist(){
      var result = {};
      document.querySelectorAll('.recovery-check').forEach(function(cb){

      });
      return result;
    }

    document.getElementById('save-reflection').addEventListener('click', function(){
      var title = document.getElementById('ref-title').value.trim();
      var date = document.getElementById('ref-date').value;
      if(!title || !date){ alert('Add a title and date first.'); return; }
      if(currentType !== 'gym' && !selectedOverall){ alert('Pick an overall rating — that\'s the one that builds objectivity over time.'); return; }

      try{
        var entry = {
          id: isEditingReflection ? existingReflection.id : uid(),
          sessionId: prefillScheduleId,
          title: title,
          date: date,
          type: currentType,
          theme: document.getElementById('ref-theme').value,
          overall: currentType === 'gym' ? null : selectedOverall,
          evidence: currentType === 'gym' ? '' : document.getElementById('ref-evidence').value.trim(),
          attributes: currentType === 'gym' ? {} : selectedAttrs,
          wentWell: existingReflection ? (existingReflection.wentWell || '') : '',
          evenBetterIf: existingReflection ? (existingReflection.evenBetterIf || '') : '',
          action: currentType === 'gym' ? '' : document.getElementById('ref-action').value.trim(),
          opponent: currentType === 'match' ? ((scheduleItem && scheduleItem.opponent) ? scheduleItem.opponent : (document.getElementById('ref-opponent') ? document.getElementById('ref-opponent').value.trim() : '')) : '',
          score: currentType === 'match' ? (document.getElementById('ref-score') ? document.getElementById('ref-score').value.trim() : '') : '',
          matchClass: currentType === 'match' ? selectedMatchClass : null,
          gymFocus: currentType === 'gym' ? (document.getElementById('ref-gym-focus') ? document.getElementById('ref-gym-focus').value.trim() : '') : '',
          gymCompleted: currentType === 'gym' ? selectedGymCompleted : null,
          recovery: null,
          analysisMatchId: currentType === 'analysis' ? (document.getElementById('ref-analysis-match') ? document.getElementById('ref-analysis-match').value : '') : ''
        };

        if(isEditingReflection){
          var idx = state.reflections.findIndex(function(r){ return r.id === existingReflection.id; });
          if(idx > -1){ state.reflections[idx] = entry; }
        } else {
          state.reflections.push(entry);
        }
        saveData();
        closeModal();
        if(isEditingReflection){ openReflectionDetail(entry.id); }
        else{ switchView(entry.date === todayIso() ? 'today' : 'journal'); }
      }catch(err){
        console.error('Save reflection failed', err);
        closeModal();
        switchView('today');
      }
    });
  }

  // ---------- Reflection Detail ----------
  function openReflectionDetail(id){
    var r = state.reflections.find(function(x){ return x.id === id; });
    if(!r) return;
    var linkedSession = r.sessionId ? state.schedule.find(function(s){ return s.id === r.sessionId; }) : null;
    var reviewedMatch = r.analysisMatchId ? state.schedule.find(function(s){ return s.id === r.analysisMatchId; }) : null;
    var hudlSession = (linkedSession && linkedSession.hudlLink) ? linkedSession : (reviewedMatch && reviewedMatch.hudlLink ? reviewedMatch : null);

    var attrHtml = ATTR_KEYS.map(function(k){
      var v = r.attributes ? r.attributes[k] : null;
      if(!v) return '';
      return '<div class="attr-bar-row"><div class="attr-bar-top"><span class="name">' + ATTR_LABELS[k] + '</span><span class="val">' + v + '/5</span></div>' +
        '<div class="attr-bar-track"><div class="attr-bar-fill" style="width:' + (v/5*100) + '%"></div></div></div>';
    }).join('');

    openModal(
      '<div class="modal-handle"></div>' +
      '<div class="modal-header"><h2>' + escapeHtml(reflectionDisplayTitle(r)) + '</h2><button class="modal-close" id="close-modal">×</button></div>' +
      '<div style="display:flex; align-items:center; gap:10px; margin-bottom:18px;">' +
        '<span class="tag ' + r.type + '">' + r.type + '</span>' +
        '<span class="card-meta">' + fmtDate(r.date) + '</span>' +
        (r.type === 'gym'
          ? '<div class="rating-pill ' + (r.gymCompleted === false ? 'r1' : 'r5') + '" style="margin-left:auto;">' + (r.gymCompleted === false ? '✗' : '✓') + '</div>'
          : '<div class="rating-pill ' + ratingClass(r.overall) + '" style="margin-left:auto;">' + r.overall + '</div>') +
      '</div>' +
      (reviewedMatch ? '<div class="journal-detail-row"><div class="k">Reviewing</div><div class="v">' + fmtDate(reviewedMatch.date) + (reviewedMatch.opponent ? ' vs ' + escapeHtml(reviewedMatch.opponent) : '') + '</div></div>' : '') +
      (hudlSession ? '<a href="' + escapeHtml(hudlSession.hudlLink) + '" target="_blank" rel="noopener" class="hudl-link" style="margin-bottom:16px;">▶ Watch on Hudl</a>' : '') +
      (r.theme ? '<div class="journal-detail-row"><div class="k">Theme</div><div class="v">' + escapeHtml(r.theme) + '</div></div>' : '') +
      (r.gymFocus ? '<div class="journal-detail-row"><div class="k">Focus</div><div class="v">' + escapeHtml(r.gymFocus) + '</div></div>' : '') +
      (r.opponent ? '<div class="journal-detail-row"><div class="k">Result</div><div class="v">vs ' + escapeHtml(r.opponent) + (r.score ? ' — ' + escapeHtml(r.score) : '') + (r.matchClass ? ' &nbsp;·&nbsp; ' + MATCH_CLASS.find(function(m){return m.key===r.matchClass;}).label : '') + '</div></div>' : '') +
      (r.evidence ? '<div class="journal-detail-row"><div class="k">Evidence for rating</div><div class="v">' + escapeHtml(r.evidence) + '</div></div>' : '') +
      (r.wentWell ? '<div class="journal-detail-row"><div class="k">What went well</div><div class="v">' + escapeHtml(r.wentWell) + '</div></div>' : '') +
      (r.evenBetterIf ? '<div class="journal-detail-row"><div class="k">Even better if</div><div class="v">' + escapeHtml(r.evenBetterIf) + '</div></div>' : '') +
      (r.action ? '<div class="journal-detail-row"><div class="k">Action for next time</div><div class="v">' + escapeHtml(r.action) + '</div></div>' : '') +
      (r.type !== 'gym' ? '<div class="section-label">Standards Check-In</div>' + attrHtml : '') +
      '<button class="btn btn-primary" id="edit-reflection" style="margin-top:18px;">Edit Reflection</button>' +
      '<button class="btn btn-ghost" id="delete-reflection" style="margin-top:10px; color:var(--red); border-color:rgba(255,107,107,0.3);">Delete Entry</button>'
    );
    document.getElementById('close-modal').addEventListener('click', closeModal);
    document.getElementById('edit-reflection').addEventListener('click', function(){
      openReflectionForm(null, r);
    });
    document.getElementById('delete-reflection').addEventListener('click', function(){
      if(confirm('Delete this reflection? This can\'t be undone.')){
        state.reflections = state.reflections.filter(function(x){ return x.id !== id; });
        saveData();
        closeModal();
        renderAll();
      }
    });
  }

  // ---------- Master render ----------
  function renderAll(){
    var versionBadge = document.getElementById('header-version');
    if(versionBadge) versionBadge.textContent = APP_VERSION;
    document.getElementById('gk-greeting').textContent = currentView === 'today'
      ? new Date().toLocaleDateString('en-GB', { weekday:'long' })
      : ({ schedule:'This Week', journal:'Journal', progress:'Your Progress', standards:'GK Standards' })[currentView];
    renderFormStrip();
    renderAvatar();
    if(currentView === 'today') renderToday();
    if(currentView === 'schedule') renderSchedule();
    if(currentView === 'journal') renderJournal();
    if(currentView === 'progress') renderProgress();
    if(currentView === 'standards'){ renderGoals(); renderStandardsView(); }
  }

  loadData();
})();
</script>
</body>
</html>
