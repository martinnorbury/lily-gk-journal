name: Keep Supabase awake
# Ver 2.

# Pings the journal database every 3 days so the free-tier project
# never hits Supabase's "7 days without activity" auto-pause.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from gk_journal
